{% extends "base.html" %}

{% block title %}Select Pass Points{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-10">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0"><i class="fas fa-hand-pointer"></i> Select Your 5 Secret Points</h3>
            </div>
            <div class="card-body">
                <div class="alert alert-warning">
                    <i class="fas fa-exclamation-triangle"></i>
                    <strong>Important:</strong> Click exactly 5 points on your image in sequence. 
                    Remember these points for login!
                </div>
                
                <div class="text-center mb-3">
                    <span class="badge bg-primary fs-5">Points Selected: <span id="pointCount">0</span>/5</span>
                </div>
                
                <div class="image-container" id="imageContainer">
                    <canvas id="imageCanvas"></canvas>
                    <img id="userImage" src="{{ url_for('static', filename=image_path) }}" style="display:none;">
                </div>
                
                <div class="mt-3 text-center">
                    <button id="resetBtn" class="btn btn-warning">
                        <i class="fas fa-redo"></i> Reset Points
                    </button>
                    <button id="submitBtn" class="btn btn-success" disabled>
                        <i class="fas fa-check"></i> Complete Registration
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/select_points.js') }}"></script>
{% endblock %}
